<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1220}
  svg{display:block;width:100%;height:100%}
</style></head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14243F"/>
      <stop offset="1" stop-color="#070C16"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CBBFF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 表盘 -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#fg)" stroke-width="22" opacity="0.95"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#60A5FA" stroke-width="22"
          stroke-dasharray="205 625" stroke-linecap="round" transform="rotate(-90 256 256)" opacity="0.9"/>
  <!-- 指针 -->
  <path d="M256 256 L256 178" stroke="#E8EEF7" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 256 L310 292" stroke="#E8EEF7" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="15" fill="#E8EEF7"/>
  <!-- 底部柱状 -->
  <rect x="186" y="424" width="26" height="24" rx="8" fill="#60A5FA" opacity="0.45"/>
  <rect x="228" y="408" width="26" height="40" rx="8" fill="#60A5FA" opacity="0.65"/>
  <rect x="270" y="390" width="26" height="58" rx="8" fill="#60A5FA" opacity="0.85"/>
  <rect x="312" y="412" width="26" height="36" rx="8" fill="#60A5FA" opacity="0.55"/>
</svg>
</body></html>
