<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0B1220" />
<title>时迹 · 屏幕时间统计</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">时</div>
      <div>
        <h1>时迹</h1>
        <p id="todayLabel">—</p>
      </div>
    </div>
    <button class="ghost" id="refreshBtn" aria-label="刷新">刷新</button>
  </header>

  <div id="gate" class="gate" hidden>
    <div class="gate-icon">⏱</div>
    <h2>需要「使用情况访问」权限</h2>
    <p>时迹要读取系统的应用使用记录，才能统计你每天用了多久、时间花在了哪些应用上。</p>
    <p class="privacy">数据只在本机读取和计算，不上传、不联网。</p>
    <button class="primary" id="grantBtn">去开启权限</button>
    <p class="tip">设置 → 应用 → 时迹 → 使用情况访问</p>
  </div>

  <main id="main" hidden>
    <div class="seg" id="seg">
      <button data-p="day" class="active">日</button>
      <button data-p="week">周</button>
      <button data-p="month">月</button>
    </div>

    <section class="card hero">
      <div class="hero-label" id="heroLabel">今日屏幕时间</div>
      <div class="hero-value">
        <span id="heroH">0</span><i>小时</i><span id="heroM">0</span><i>分</i>
      </div>
      <div class="hero-sub" id="heroSub"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3 id="chartTitle">最近 7 天</h3>
        <span id="chartHint"></span>
      </div>
      <div class="chart" id="barChart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>时间去哪了</h3>
        <span id="catTotal"></span>
      </div>
      <div class="cat-wrap">
        <div class="donut" id="donut"><div class="donut-hole"><b id="donutMain">0h</b><span>合计</span></div></div>
        <ul class="legend" id="legend"></ul>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h3>应用排行</h3>
        <span id="rankCount"></span>
      </div>
      <ul class="rank" id="rank"></ul>
      <div class="empty" id="rankEmpty" hidden>这段时间没有记录</div>
    </section>

    <p class="foot">数据仅在本机读取，不上传、不联网</p>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
