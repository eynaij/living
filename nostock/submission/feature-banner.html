<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px; height: 500px; overflow: hidden;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 160% at 12% 0%, #12233f 0%, #0a1120 45%, #060a12 100%);
    color: #e8eef7; display: flex; align-items: center;
    position: relative;
  }
  .glow {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,.30), transparent 62%);
    right: -140px; top: -180px;
  }
  .left { padding-left: 68px; position: relative; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo {
    width: 56px; height: 56px; border-radius: 15px;
    background: linear-gradient(145deg, #3B82F6, #1D4ED8);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -1px;
  }
  .brand-name { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  h1 { font-size: 54px; font-weight: 800; letter-spacing: 1px; line-height: 1.16; }
  h1 em { font-style: normal; color: #60A5FA; }
  .sub { margin-top: 20px; font-size: 21px; color: #93A4BC; letter-spacing: .5px; }
  .stats { margin-top: 34px; display: flex; gap: 44px; }
  .stat b { display: block; font-size: 34px; font-weight: 800; color: #60A5FA; }
  .stat span { font-size: 14px; color: #7C8CA6; letter-spacing: 1px; }
  .phone {
    position: absolute; right: 76px; top: 52px; width: 214px; height: 396px;
    border-radius: 26px; border: 6px solid #1c2740;
    background: linear-gradient(180deg, #0d1626, #0a1220);
    box-shadow: 0 26px 60px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center;
    padding-top: 40px; gap: 8px; z-index: 2;
  }
  .phone .num { font-size: 76px; font-weight: 800; color: #60A5FA; line-height: 1; }
  .phone .cap { font-size: 13px; color: #8fa0b8; letter-spacing: 2px; }
  .phone .bar {
    margin-top: 18px; width: 150px; height: 46px; border-radius: 12px;
    background: rgba(59,130,246,.16); border: 1px solid rgba(96,165,250,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #7dd3fc;
  }
  .phone .row { display: flex; gap: 8px; margin-top: 12px; }
  .phone .cell { width: 45px; height: 8px; border-radius: 4px; background: rgba(96,165,250,.35); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand">
      <div class="logo">戒</div>
      <div class="brand-name">戒股</div>
    </div>
    <h1>把「不买」<br>练成<em>习惯</em></h1>
    <div class="sub">每日打卡 · 冲动记录 · 亏损记账 · 每周复盘</div>
    <div class="stats">
      <div class="stat"><b>连续天数</b><span>看得见的自律</span></div>
      <div class="stat"><b>冲动记录</b><span>看清触发点</span></div>
      <div class="stat"><b>完全离线</b><span>无账号 无广告</span></div>
    </div>
  </div>
  <div class="phone">
    <div class="num">32</div>
    <div class="cap">已经连续</div>
    <div class="bar">今天已打卡 ✓</div>
    <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
  </div>
</body>
</html>
