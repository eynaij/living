plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qingying'
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId "com.qingying"
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName "1.7.1"
    }

    signingConfigs {
        release {
            storeFile file('../../android/qingying-release.keystore')
            storePassword 'qingying2026'
            keyAlias 'qingying'
            keyPassword 'qingying2026'
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile '../../android/AndroidManifest.xml'
            java.srcDirs = ['../../android/java']
            res.srcDirs = ['../../android/res']
        }
    }
}

dependencies {
}
